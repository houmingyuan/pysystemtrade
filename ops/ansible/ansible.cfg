# 在 ops/ansible 目录下运行，先试跑再执行：
#   ansible-playbook playbooks/<名字>.yml --check
#   ansible-playbook playbooks/<名字>.yml
[defaults]
inventory = inventory.yml
roles_path = roles
log_path = ~/Library/Logs/systrade/ansible.log
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[diff]
always = True
